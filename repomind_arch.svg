<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d14"/>
      <stop offset="100%" stop-color="#141829"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a26"/>
      <stop offset="100%" stop-color="#10121d"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Subtle Grid -->
  <g opacity="0.08" stroke="#7ab2ff" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(40, 36)">
    <rect width="110" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="600" letter-spacing="1">SYSTEM ARCH</text>
    <text x="124" y="17" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">RepoMind · Codebase RAG Intelligence</text>
    <text x="124" y="38" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Sub-200ms First Token · Spring AI + pgvector + Server-Sent Events</text>
  </g>

  <!-- Pipeline Diagram Nodes -->
  <!-- Node 1: Ingestion -->
  <g transform="translate(40, 120)" filter="url(#shadow)">
    <rect width="210" height="250" rx="12" fill="url(#cardBg)" stroke="#283049" stroke-width="1.5"/>
    <rect x="16" y="18" width="36" height="36" rx="8" fill="#1e293b"/>
    <path d="M26 36 L42 36 M34 28 L42 36 L34 44" stroke="#60a5fa" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="64" y="34" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Repo Ingestion</text>
    <text x="64" y="48" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10">Source Parsing</text>

    <!-- Bullets -->
    <rect x="16" y="74" width="178" height="34" rx="6" fill="#121522"/>
    <text x="26" y="95" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">500+ Files Indexed &lt;60s</text>
    
    <rect x="16" y="118" width="178" height="34" rx="6" fill="#121522"/>
    <text x="26" y="139" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Language-Aware Chunking</text>

    <rect x="16" y="162" width="178" height="34" rx="6" fill="#121522"/>
    <text x="26" y="183" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Metadata &amp; AST Tagging</text>

    <rect x="16" y="206" width="178" height="24" rx="4" fill="#1e293b"/>
    <text x="24" y="222" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10" font-weight="600">Java 21 · Spring Boot</text>
  </g>

  <!-- Connecting Arrow 1 -> 2 -->
  <path d="M260 245 L285 245" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="285,241 295,245 285,249" fill="#3b82f6"/>

  <!-- Node 2: Vector Engine -->
  <g transform="translate(295, 120)" filter="url(#shadow)">
    <rect width="210" height="250" rx="12" fill="url(#cardBg)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="16" y="18" width="36" height="36" rx="8" fill="#1e3a8a"/>
    <circle cx="34" cy="36" r="8" fill="none" stroke="#93c5fd" stroke-width="2"/>
    <circle cx="34" cy="36" r="3" fill="#60a5fa"/>
    <text x="64" y="34" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Vector Store</text>
    <text x="64" y="48" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10">pgvector · HNSW Index</text>

    <rect x="16" y="74" width="178" height="34" rx="6" fill="#121522"/>
    <text x="26" y="95" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">OpenAI Embeddings</text>
    
    <rect x="16" y="118" width="178" height="34" rx="6" fill="#121522"/>
    <text x="26" y="139" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Cosine Similarity Search</text>

    <rect x="16" y="162" width="178" height="34" rx="6" fill="#121522"/>
    <text x="26" y="183" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">File-Scope Filtering</text>

    <rect x="16" y="206" width="178" height="24" rx="4" fill="#1e3a8a"/>
    <text x="24" y="222" fill="#bfdbfe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10" font-weight="600">PostgreSQL · pgvector</text>
  </g>

  <!-- Connecting Arrow 2 -> 3 -->
  <path d="M515 245 L540 245" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="540,241 550,245 540,249" fill="#3b82f6"/>

  <!-- Node 3: Streaming & Output -->
  <g transform="translate(550, 120)" filter="url(#shadow)">
    <rect width="210" height="250" rx="12" fill="url(#cardBg)" stroke="#283049" stroke-width="1.5"/>
    <rect x="16" y="18" width="36" height="36" rx="8" fill="#1e293b"/>
    <path d="M26 36 Q34 26 42 36" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <path d="M28 41 Q34 32 40 41" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <text x="64" y="34" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">SSE Generation</text>
    <text x="64" y="48" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10">Streaming &amp; Citations</text>

    <rect x="16" y="74" width="178" height="34" rx="6" fill="#121522"/>
    <text x="26" y="95" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Sub-200ms First-Token</text>
    
    <rect x="16" y="118" width="178" height="34" rx="6" fill="#121522"/>
    <text x="26" y="139" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Exact Line/File Citations</text>

    <rect x="16" y="162" width="178" height="34" rx="6" fill="#121522"/>
    <text x="26" y="183" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Server-Sent Events Stream</text>

    <rect x="16" y="206" width="178" height="24" rx="4" fill="#1e293b"/>
    <text x="24" y="222" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10" font-weight="600">Next.js · Spring AI</text>
  </g>
</svg>
