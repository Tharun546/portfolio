<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f08"/>
      <stop offset="100%" stop-color="#1c140a"/>
    </linearGradient>
    <linearGradient id="cardBg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24190c"/>
      <stop offset="100%" stop-color="#191107"/>
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg4)"/>
  
  <!-- Grid -->
  <g opacity="0.08" stroke="#f59e0b" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(40, 36)">
    <rect width="110" height="24" rx="6" fill="#78350f" stroke="#b45309" stroke-width="1"/>
    <text x="12" y="16" fill="#fde68a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="600" letter-spacing="1">SYSTEM ARCH</text>
    <text x="124" y="17" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">SprintForge · AI Kanban &amp; Roadmap Planner</text>
    <text x="124" y="38" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Next.js 15 Server Actions · Strongly-Typed Zod Schemas · PgBouncer Connection Pooling</text>
  </g>

  <!-- Node 1: Decomposition -->
  <g transform="translate(40, 120)" filter="url(#shadow4)">
    <rect width="210" height="250" rx="12" fill="url(#cardBg4)" stroke="#3a2510" stroke-width="1.5"/>
    <rect x="16" y="18" width="36" height="36" rx="8" fill="#451a03"/>
    <rect x="26" y="27" width="6" height="18" rx="1" fill="#fbbf24"/>
    <rect x="34" y="32" width="6" height="13" rx="1" fill="#f59e0b"/>
    <rect x="42" y="29" width="6" height="16" rx="1" fill="#d97706"/>
    <text x="64" y="34" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Goal Ingestion</text>
    <text x="64" y="48" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10">Next.js 15 Actions</text>

    <rect x="16" y="74" width="178" height="34" rx="6" fill="#130d05"/>
    <text x="26" y="95" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">High-Level Goal Prompts</text>
    
    <rect x="16" y="118" width="178" height="34" rx="6" fill="#130d05"/>
    <text x="26" y="139" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Server Action Execution</text>

    <rect x="16" y="162" width="178" height="34" rx="6" fill="#130d05"/>
    <text x="26" y="183" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Zero Client Leaks</text>

    <rect x="16" y="206" width="178" height="24" rx="4" fill="#78350f"/>
    <text x="24" y="222" fill="#fef3c7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10" font-weight="600">Next.js 15 · TypeScript</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M260 245 L285 245" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="285,241 295,245 285,249" fill="#f59e0b"/>

  <!-- Node 2: AI Planning Engine -->
  <g transform="translate(295, 120)" filter="url(#shadow4)">
    <rect width="210" height="250" rx="12" fill="url(#cardBg4)" stroke="#b45309" stroke-width="1.5"/>
    <rect x="16" y="18" width="36" height="36" rx="8" fill="#78350f"/>
    <circle cx="34" cy="36" r="8" stroke="#fde68a" stroke-width="1.5" fill="none"/>
    <path d="M30 36 L33 39 L39 33" stroke="#fde68a" stroke-width="1.5" fill="none"/>
    <text x="64" y="34" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Schema Validation</text>
    <text x="64" y="48" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10">Zod &amp; Gemini AI</text>

    <rect x="16" y="74" width="178" height="34" rx="6" fill="#130d05"/>
    <text x="26" y="95" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Google Generative AI</text>
    
    <rect x="16" y="118" width="178" height="34" rx="6" fill="#130d05"/>
    <text x="26" y="139" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Zod Schema Enforcement</text>

    <rect x="16" y="162" width="178" height="34" rx="6" fill="#130d05"/>
    <text x="26" y="183" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Human-in-the-Loop Edit</text>

    <rect x="16" y="206" width="178" height="24" rx="4" fill="#92400e"/>
    <text x="24" y="222" fill="#fffbeb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10" font-weight="600">Zod · Gemini API</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M515 245 L540 245" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="540,241 550,245 540,249" fill="#f59e0b"/>

  <!-- Node 3: Database & Pooling -->
  <g transform="translate(550, 120)" filter="url(#shadow4)">
    <rect width="210" height="250" rx="12" fill="url(#cardBg4)" stroke="#3a2510" stroke-width="1.5"/>
    <rect x="16" y="18" width="36" height="36" rx="8" fill="#451a03"/>
    <ellipse cx="34" cy="30" rx="9" ry="4" stroke="#fbbf24" stroke-width="1.5" fill="none"/>
    <path d="M25 30 V42 Q34 46 43 42 V30" stroke="#fbbf24" stroke-width="1.5" fill="none"/>
    <text x="64" y="34" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">DB Connection</text>
    <text x="64" y="48" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10">Prisma &amp; PgBouncer</text>

    <rect x="16" y="74" width="178" height="34" rx="6" fill="#130d05"/>
    <text x="26" y="95" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Prisma ORM Types</text>
    
    <rect x="16" y="118" width="178" height="34" rx="6" fill="#130d05"/>
    <text x="26" y="139" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">PgBouncer Pool Safety</text>

    <rect x="16" y="162" width="178" height="34" rx="6" fill="#130d05"/>
    <text x="26" y="183" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Stable Serverless Load</text>

    <rect x="16" y="206" width="178" height="24" rx="4" fill="#78350f"/>
    <text x="24" y="222" fill="#fde68a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10" font-weight="600">Prisma · PostgreSQL</text>
  </g>
</svg>
